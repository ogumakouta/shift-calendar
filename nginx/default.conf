# /api/ へのリクエストをバックエンド(Nest.js)に転送
server {
  listen 80;
  server_name localhost;

  location /api/ {
    proxy_pass http://backend:8000; # "backend"はサービス名, 8000はコンテナ内のポート
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

  # それ以外のリクエストをフロントエンド(Next.js)に転送
  location / {
    proxy_pass http://frontend:3000; # "frontend"はサービス名, 3000はコンテナ内のポート
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}